# Perfil de tests: siempre contra la base local turnos_test (nunca contra turnos).
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/turnos_test}
    # Spring cachea un contexto por configuración de test, cada uno con su pool. Con el pool por defecto (10)
    # se agotan las conexiones de PostgreSQL (max_connections). 4 alcanzan incluso para TurnoConcurrenciaIT.
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  flyway:
    # Habilitado solo acá: cada corrida limpia y recrea turnos_test (ver FlywayLimpiezaTestConfig).
    clean-disabled: false

# Valores FICTICIOS solo para tests. No son credenciales reales y no se usan fuera de turnos_test.
app:
  seguridad:
    jwt-secret: secreto-ficticio-solo-para-tests-0123456789abcdef
    jwt-exp-minutos: 480
    frontend-origin: http://localhost:5173
  admin:
    email: odontologo@example.com
    password: ClaveDePrueba123
