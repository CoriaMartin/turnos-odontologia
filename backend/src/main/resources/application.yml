spring:
  application:
    name: turnos-odonto
  config:
    # Lee el .env local si existe (raíz del repo o backend/). Las variables de entorno reales tienen prioridad.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true
  autoconfigure:
    # La autenticación es por JWT (C-04): sin usuario en memoria ni contraseña generada.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app:
  seguridad:
    jwt-secret: ${JWT_SECRET:}
    jwt-exp-minutos: ${JWT_EXP_MINUTES:480}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
