<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Agenda de Odontología</title>
<link rel="stylesheet" href="../../../../design-system/tokens.css">
<link rel="stylesheet" href="login.css?v=3">
</head>
<body>
<main class="pagina-login">
  <div class="tarjeta">
    <form class="login" novalidate onsubmit="return false" aria-labelledby="titulo-login">
      <div class="marca"><img src="../../../../design-system/assets/logo.svg" alt=""><strong data-brand-name>Agenda de Odontología</strong></div>
      <h1 id="titulo-login">Ingresá a tu agenda</h1>
      <p class="sub">Usá el email y la contraseña del consultorio.</p>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" placeholder="tu@consultorio.com" value="consultorio@ejemplo.com" readonly></div>
      <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" value="contrasenia-ficticia" readonly></div>
      <button class="btn btn-primary btn-block" type="submit" aria-busy="true" aria-disabled="true"><span class="spinner" aria-hidden="true"></span>Ingresando…</button>
    </form>
  </div>
</main>
<span class="rotulo-maqueta" aria-hidden="true">Maqueta C-14 · cargando</span>
<script src="../../../../design-system/brand.js"></script>
</body>
</html>
